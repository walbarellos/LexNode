<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JusBrasil - Plataforma de Busca de Inteligência Jurídica em Sistemas Judiciais.">
    <title>JusBrasil - Pesquisa Processual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF', // dark blue
                        primaryHover: '#1E3A8A',
                        secondary: '#10B981', // green
                        lightbg: '#F3F4F6', // light gray
                        whitebg: '#FFFFFF',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                        'pulse-glow': 'pulseGlow 2s infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(15px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 15px rgba(59, 130, 246, 0.3)' },
                            '50%': { boxShadow: '0 0 25px rgba(139, 92, 246, 0.5)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F3F4F6;
            color: #1F2937;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }
        
        .header-bg {
            background: #FFFFFF;
            border-bottom: 1px solid #E5E7EB;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .card-bg {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.2s ease;
        }

        .card-bg:hover, .card-bg:focus-within {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-color: #93C5FD;
        }

        .tab-btn {
            position: relative;
            transition: all 0.3s ease;
        }
        
        .tab-btn.active {
            color: #1E40AF;
            font-weight: 600;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #1E40AF;
            border-radius: 2px;
        }

        .input-search {
            background: #FFFFFF;
            border: 1px solid #D1D5DB;
            color: #111827;
            transition: all 0.3s ease;
        }

        .input-search:focus {
            outline: none;
            border-color: #3B82F6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #F3F4F6;
        }
        ::-webkit-scrollbar-thumb {
            background: #D1D5DB;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9CA3AF;
        }

        .loading-spinner {
            border: 3px solid #E5E7EB;
            border-top-color: #3B82F6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .brand-text {
            color: #1F2937;
        }
        .brand-text-accent {
            color: #1E40AF;
        }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="antialiased selection:bg-primary selection:text-white pb-20">

    <!-- Header -->
    <header class="header-bg sticky top-0 z-50 px-6 py-4 flex justify-between items-center" role="banner">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shadow-md" aria-hidden="true">
                <i class="fa-solid fa-scale-balanced text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-tight brand-text leading-none">Jus<span class="brand-text-accent">Brasil</span></h1>
                <p class="text-xs text-gray-500 font-medium tracking-widest uppercase mt-1" aria-hidden="true">Informação Jurídica</p>
            </div>
        </div>
        <nav class="flex gap-4" aria-label="Navegação Principal">
            <button class="text-gray-500 hover:text-blue-600 transition-colors p-2" aria-label="Notificações"><i class="fa-solid fa-bell"></i></button>
            <button class="text-gray-500 hover:text-blue-600 transition-colors p-2" aria-label="Configurações"><i class="fa-solid fa-gear"></i></button>
            <div class="w-8 h-8 rounded-full bg-gray-200 border border-gray-300 flex items-center justify-center" aria-label="Perfil do Usuário">
                <i class="fa-solid fa-user text-sm text-gray-500" aria-hidden="true"></i>
            </div>
        </nav>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto mt-12 px-4" role="main">
        
        <!-- Search Section -->
        <section class="card-bg rounded-2xl p-6 sm:p-8 mb-12 animate-slide-up" aria-labelledby="search-heading">
            <h2 id="search-heading" class="text-3xl font-semibold text-gray-800 mb-2">Pesquisa de Processos e Jurisprudência</h2>
            <p class="text-gray-600 mb-8 text-sm">Busque por nome, CPF/CNPJ ou número do processo. Acesse dados do TRF1 e TJAC simultaneamente.</p>
            
            <!-- Tabs -->
            <div class="flex border-b border-gray-200 mb-6 gap-6" role="tablist" aria-label="Tipos de Busca">
                <button onclick="switchTab('nome')" id="tab-nome" class="tab-btn active pb-3 text-sm font-medium text-gray-500 hover:text-gray-800 flex items-center gap-2 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-t-lg px-2" role="tab" aria-selected="true" aria-controls="search-panel">
                    <i class="fa-solid fa-users" aria-hidden="true"></i> Nome / Documento
                </button>
                <button onclick="switchTab('processo')" id="tab-processo" class="tab-btn pb-3 text-sm font-medium text-gray-500 hover:text-gray-800 flex items-center gap-2 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-t-lg px-2" role="tab" aria-selected="false" aria-controls="search-panel">
                    <i class="fa-solid fa-gavel" aria-hidden="true"></i> Número do Processo
                </button>
                <button onclick="switchTab('jurisprudencia')" id="tab-jurisprudencia" class="tab-btn pb-3 text-sm font-medium text-gray-500 hover:text-gray-800 flex items-center gap-2 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-t-lg px-2" role="tab" aria-selected="false" aria-controls="search-panel">
                    <i class="fa-solid fa-book-open" aria-hidden="true"></i> Jurisprudência
                </button>
            </div>

            <!-- Search Form -->
            <div id="search-panel" role="tabpanel" aria-labelledby="tab-nome">
                <form id="search-form" onsubmit="handleSearch(event)" class="relative flex items-center w-full">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 text-gray-400" aria-hidden="true"></i>
                    <label for="search-input" class="sr-only">Termo de Busca</label>
                    <input type="text" id="search-input" 
                        class="input-search w-full rounded-xl py-4 pl-12 pr-32 text-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Nome da parte, CPF ou CNPJ (Busca simultânea TRF1 e TJAC)..." required aria-required="true">
                    
                    <!-- Grau selector for Processo (TJAC only fallback) -->
                    <label for="grau-select" class="sr-only">Instância</label>
                    <select id="grau-select" class="absolute right-36 bg-white border border-gray-300 text-sm rounded-lg px-3 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 hidden" aria-hidden="true">
                        <option value="1">1º Grau</option>
                        <option value="2">2º Grau</option>
                    </select>

                    <button type="submit" id="search-btn" class="absolute right-2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition-colors shadow-sm flex items-center gap-2 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2" aria-label="Realizar Busca">
                        <span>Buscar</span>
                    </button>
                </form>
            </div>
        </section>

        <!-- Results Section -->
        <div id="loading-indicator" class="hidden flex-col items-center justify-center py-12 animate-fade-in" aria-live="polite">
            <div class="loading-spinner mb-4"></div>
            <p class="text-blue-600 font-medium tracking-wide">Varrendo sistemas judiciais (TRF1 & TJAC)...</p>
        </div>

        <div id="error-message" class="hidden card-bg border-red-300 bg-red-50 p-4 rounded-xl text-red-700 mb-8 animate-fade-in flex items-start gap-3" role="alert" aria-live="assertive">
            <i class="fa-solid fa-triangle-exclamation mt-1"></i>
            <div>
                <h4 class="font-bold text-red-800">Consulta Falhou</h4>
                <p id="error-text" class="text-sm mt-1"></p>
            </div>
        </div>

        <div id="results-container" class="space-y-6 hidden animate-slide-up" aria-live="polite">
            <!-- Results will be injected here -->
        </div>

    </main>

    <script>
        let currentTab = 'nome';

        function switchTab(tab) {
            currentTab = tab;
            
            // Update UI roles and styles
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.setAttribute('aria-selected', 'false');
            });
            const activeBtn = document.getElementById(`tab-${tab}`);
            activeBtn.classList.add('active');
            activeBtn.setAttribute('aria-selected', 'true');
            
            const input = document.getElementById('search-input');
            const grauSelect = document.getElementById('grau-select');
            
            input.value = '';
            document.getElementById('results-container').innerHTML = '';
            document.getElementById('results-container').classList.add('hidden');
            document.getElementById('error-message').classList.add('hidden');
            
            if (tab === 'processo') {
                input.placeholder = "Ex: 0800224-44.2013.8.01.0001 (Automático TRF1/TJAC)";
                grauSelect.style.display = 'block';
                grauSelect.setAttribute('aria-hidden', 'false');
            } else if (tab === 'nome') {
                input.placeholder = "Nome da parte, CPF ou CNPJ (Busca simultânea TRF1 e TJAC)...";
                grauSelect.style.display = 'none';
                grauSelect.setAttribute('aria-hidden', 'true');
            } else if (tab === 'jurisprudencia') {
                input.placeholder = "Termo de busca livre na jurisprudência (ex: roubo majorado)...";
                grauSelect.style.display = 'none';
                grauSelect.setAttribute('aria-hidden', 'true');
            }

            // UX Enhancement: Auto-focus input after switching tabs
            input.focus();
        }

        async function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            const resultsContainer = document.getElementById('results-container');
            const loadingIndicator = document.getElementById('loading-indicator');
            const errorMsg = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const btn = document.getElementById('search-btn');

            // Reset state
            resultsContainer.innerHTML = '';
            resultsContainer.classList.add('hidden');
            errorMsg.classList.add('hidden');
            loadingIndicator.classList.remove('hidden');
            loadingIndicator.classList.add('flex');

            // UX Enhancement: Localized loading feedback
            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');
            const originalBtnContent = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i><span>Buscando</span>';

            try {
                let url = '';
                
                if (currentTab === 'processo') {
                    const grau = document.getElementById('grau-select').value;
                    url = `/api/buscar/processo/${encodeURIComponent(query)}?grau=${grau}`;
                } else if (currentTab === 'nome') {
                    const isDoc = /^[\d\.\-\/]+$/.test(query) && query.replace(/\D/g, '').length >= 11;
                    url = `/api/buscar/nome/${encodeURIComponent(query)}?doc=${isDoc ? 'true' : 'false'}`;
                } else if (currentTab === 'jurisprudencia') {
                    url = `/api/buscar/jurisprudencia/${encodeURIComponent(query)}`;
                }

                const response = await fetch(url);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Ocorreu um erro desconhecido');
                }

                renderResults(data, currentTab);
                
            } catch (err) {
                errorText.textContent = err.message;
                errorMsg.classList.remove('hidden');
            } finally {
                loadingIndicator.classList.add('hidden');
                loadingIndicator.classList.remove('flex');

                // UX Enhancement: Restore button state
                btn.disabled = false;
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
                btn.innerHTML = originalBtnContent;
            }
        }

        function renderResults(data, type) {
            const container = document.getElementById('results-container');
            container.innerHTML = '';
            
            if (type === 'processo') {
                container.innerHTML = renderProcessoCard(data);
            } else if (type === 'nome' || type === 'jurisprudencia') {
                const results = data.resultados || [];
                
                if (results.length === 0) {
                    container.innerHTML = `
                        <div class="card-bg p-8 rounded-2xl text-center">
                            <i class="fa-regular fa-folder-open text-4xl text-gray-400 mb-4" aria-hidden="true"></i>
                            <h3 class="text-xl font-medium text-gray-700">Nenhum resultado encontrado</h3>
                            <p class="text-gray-500 mt-2">Tente modificar seus termos de busca.</p>
                        </div>
                    `;
                } else {
                    const header = `<div class="text-sm text-gray-600 mb-4 flex items-center gap-2"><i class="fa-solid fa-bolt text-yellow-500" aria-hidden="true"></i> ${results.length} registros recuperados em todos os sistemas</div>`;
                    
                    let cards = '';
                    if (type === 'nome') {
                        cards = results.map(r => renderResumoCard(r)).join('');
                    } else {
                        cards = results.map(r => renderJurisprudenciaCard(r)).join('');
                    }
                    
                    container.innerHTML = header + `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">${cards}</div>`;
                }
            }
            
            container.classList.remove('hidden');
        }

        function getSistemaBadge(sistema) {
            if (!sistema) return '';
            const colorClass = sistema.includes('TRF1') ? 'bg-green-100 text-green-700 border-green-200' : 'bg-blue-100 text-blue-700 border-blue-200';
            return `<span class="px-2 py-0.5 ${colorClass} border rounded text-xs font-medium tracking-wide uppercase">${sistema}</span>`;
        }

        function renderProcessoCard(p) {
            // Partes
            let partesHtml = '';
            if (p.partes && p.partes.length > 0) {
                partesHtml = `
                    <div class="mt-6 border-t border-gray-200 pt-6">
                        <h4 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-users" aria-hidden="true"></i> Sujeitos do Processo
                        </h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${p.partes.map(parte => `
                                <div class="bg-gray-50 rounded-lg p-3 border border-gray-200">
                                    <span class="text-xs text-blue-600 font-medium">${parte.tipo}</span>
                                    <p class="text-gray-800 font-medium text-sm mt-1">${parte.nome}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // Movimentações
            let movHtml = '';
            if (p.movimentacoes && p.movimentacoes.length > 0) {
                movHtml = `
                    <div class="mt-6 border-t border-gray-200 pt-6">
                        <h4 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-timeline" aria-hidden="true"></i> Últimas Movimentações
                        </h4>
                        <div class="space-y-4 pl-2 border-l-2 border-gray-200">
                            ${p.movimentacoes.slice(0, 5).map(m => `
                                <div class="relative pl-4">
                                    <div class="absolute w-2 h-2 bg-blue-500 rounded-full -left-[5px] top-1.5 shadow-sm"></div>
                                    <span class="text-xs text-gray-500 font-mono">${m.data}</span>
                                    <p class="text-gray-700 text-sm mt-0.5">${m.descricao}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            let extraActions = '';
            if (p.link_detalhe) {
                extraActions = `
                    <a href="${p.link_detalhe}" target="_blank" rel="noopener noreferrer" class="mt-6 block text-center w-full bg-white hover:bg-gray-50 text-blue-600 font-medium py-2 px-4 rounded-lg transition-colors border border-gray-300">
                        Abrir Processo Original (TRF1) <i class="fa-solid fa-external-link-alt ml-2 text-xs"></i>
                    </a>
                `;
            }

            return `
                <article class="card-bg rounded-2xl p-6 sm:p-8 animate-fade-in relative overflow-hidden" aria-labelledby="proc-${p.numero_processo}">
                    <div class="absolute top-0 right-0 p-4 opacity-5 pointer-events-none" aria-hidden="true">
                        <i class="fa-solid fa-scale-balanced text-9xl text-gray-300"></i>
                    </div>
                    
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <div>
                            ${getSistemaBadge(p.sistema)}
                            <h3 id="proc-${p.numero_processo}" class="text-2xl font-bold text-gray-800 mt-3 font-mono">${p.numero_processo}</h3>
                            <p class="text-gray-500 text-sm mt-1">${p.classe || 'Classe não informada'}</p>
                        </div>
                        <div class="text-right">
                            <div class="text-sm text-gray-500 mb-1">Status</div>
                            <div class="inline-flex items-center gap-2 px-3 py-1.5 bg-gray-50 rounded-lg border border-gray-200">
                                <div class="w-2 h-2 rounded-full ${p.situacao?.toLowerCase().includes('baixado') ? 'bg-red-500' : 'bg-green-500'}" aria-hidden="true"></div>
                                <span class="text-gray-700 font-medium text-sm">${p.situacao || 'Desconhecido'}</span>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-6 bg-gray-50 p-5 rounded-xl border border-gray-200">
                        <div>
                            <span class="text-xs text-gray-500 block mb-1">Assunto</span>
                            <span class="text-sm text-gray-800 font-medium">${p.assunto || '-'}</span>
                        </div>
                        <div>
                            <span class="text-xs text-gray-500 block mb-1">Magistrado</span>
                            <span class="text-sm text-gray-800 font-medium">${p.juiz || p.relator || '-'}</span>
                        </div>
                        <div>
                            <span class="text-xs text-gray-500 block mb-1">Órgão Julgador</span>
                            <span class="text-sm text-gray-800 font-medium">${p.vara || p.orgao_julgador || p.foro || '-'}</span>
                        </div>
                        <div>
                            <span class="text-xs text-gray-500 block mb-1">Distribuição</span>
                            <span class="text-sm text-gray-800 font-medium">${p.distribuicao || '-'}</span>
                        </div>
                    </div>

                    ${partesHtml}
                    ${movHtml}
                    ${extraActions}
                </article>
            `;
        }

        function renderResumoCard(r) {
            return `
                <article class="card-bg p-5 rounded-xl animate-fade-in flex flex-col h-full cursor-pointer hover:bg-blue-50 group focus-within:ring-2 focus-within:ring-blue-500" tabindex="0" onkeypress="if(event.key === 'Enter'){document.getElementById('search-input').value='${r.numero}'; switchTab('processo'); handleSearch(new Event('submit'))}" onclick="document.getElementById('search-input').value='${r.numero}'; switchTab('processo'); handleSearch(new Event('submit'))" aria-label="Processo ${r.numero}">
                    <div class="flex justify-between items-start mb-3">
                        <span class="font-mono text-blue-600 group-hover:text-blue-700 transition-colors">${r.numero}</span>
                        ${getSistemaBadge(r.sistema)}
                    </div>
                    <div class="mb-3 flex-grow">
                        <h4 class="text-gray-800 font-medium text-sm leading-snug">${r.classe}</h4>
                        <p class="text-gray-500 text-xs mt-1 line-clamp-2">${r.assunto}</p>
                    </div>
                    <div class="mt-auto border-t border-gray-100 pt-3 flex flex-col gap-2">
                        <div class="text-xs flex justify-between">
                            <span class="text-gray-500">Última mov.:</span>
                            <span class="text-gray-700 font-medium text-right line-clamp-1 max-w-[50%]">${r.data_local || 'N/A'}</span>
                        </div>
                        <div class="text-xs flex justify-between items-end">
                            <span class="text-gray-500">Partes:</span>
                            <span class="text-gray-700 font-medium text-right line-clamp-2 max-w-[65%]">${r.participacao || '-'}</span>
                        </div>
                    </div>
                </article>
            `;
        }

        function renderJurisprudenciaCard(j) {
            return `
                <article class="card-bg p-6 rounded-xl animate-fade-in flex flex-col h-full group relative overflow-hidden" tabindex="0" onkeypress="if(event.key === 'Enter'){document.getElementById('search-input').value='${j.numero}'; document.getElementById('grau-select').value='2'; switchTab('processo'); handleSearch(new Event('submit'))}">
                    <div class="absolute top-0 right-0 p-4 opacity-5 pointer-events-none group-hover:opacity-10 transition-opacity" aria-hidden="true">
                        <i class="fa-solid fa-book-open text-6xl text-gray-300"></i>
                    </div>
                    
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="font-mono text-purple-600 text-lg group-hover:text-purple-700 transition-colors block cursor-pointer focus:outline-none focus:underline" onclick="document.getElementById('search-input').value='${j.numero}'; document.getElementById('grau-select').value='2'; switchTab('processo'); handleSearch(new Event('submit'))">${j.numero}</span>
                            <span class="text-xs text-gray-500 font-medium mt-1 block">${j.orgao}</span>
                        </div>
                        <span class="text-xs text-gray-600 bg-gray-100 px-2 py-1 rounded-md border border-gray-200">${j.data}</span>
                    </div>
                    
                    <div class="text-sm text-gray-700 bg-gray-50 p-4 rounded-lg border border-gray-200 mb-4 line-clamp-6 font-serif italic flex-grow">
                        "${j.ementa}"
                    </div>
                    
                    <div class="mt-auto pt-3 flex items-center gap-2">
                        <i class="fa-solid fa-user-pen text-gray-400 text-xs" aria-hidden="true"></i>
                        <span class="text-xs text-gray-500"><strong class="text-gray-700 font-medium">Relator:</strong> ${j.relator}</span>
                    </div>
                </article>
            `;
        }
    </script>
</body>
</html>
